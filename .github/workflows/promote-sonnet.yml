name: Promote Sonnet stable release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-sonnet.yml'
      - 'variants/sonnet/**'
      - 'tools/materialize_sonnet.py'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Materialize stable Sonnet
        run: python tools/materialize_sonnet.py
      - name: Validate existing stable distributions
        run: python tools/validate_all.py
      - name: Validate Sonnet
        run: python -m pytest -q
        working-directory: minmax-orchestrator-sonnet
      - name: Clean generated caches
        run: |
          find minmax-orchestrator-sonnet -type d -name '__pycache__' -prune -exec rm -rf {} +
          find minmax-orchestrator-sonnet -type d -name '.pytest_cache' -prune -exec rm -rf {} +
      - name: Commit stable release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A minmax-orchestrator-sonnet
          if git diff --cached --quiet; then
            echo 'Sonnet release already materialized.'
            exit 0
          fi
          git commit -m 'Promote stable Sonnet orchestrator release'
          git push
