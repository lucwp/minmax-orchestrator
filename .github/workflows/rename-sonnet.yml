name: Rename Sonnet distribution

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-sonnet.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Rename Sonnet release and maintenance surfaces
        run: |
          git mv minmax-orchestrator-sonnet-5 minmax-orchestrator-sonnet
          git mv variants/sonnet-5 variants/sonnet
          git mv tools/materialize_sonnet_5.py tools/materialize_sonnet.py
          git mv .github/workflows/promote-sonnet-5.yml .github/workflows/promote-sonnet.yml
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          # Distribution identity: rename the Skill, not the underlying Anthropic model IDs.
          replacements_by_file = {
              Path('minmax-orchestrator-sonnet/SKILL.md'): [
                  ('name: minmax-orchestrator-sonnet-5', 'name: minmax-orchestrator-sonnet'),
                  ('description: "Claude Sonnet 5-specific workspace-level manager/orchestrator', 'description: "Claude Sonnet-specific workspace-level manager/orchestrator'),
                  ('# MinMax Orchestrator Sonnet 5', '# MinMax Orchestrator Sonnet'),
              ],
              Path('minmax-orchestrator-sonnet/agents/openai.yaml'): [
                  ('display_name: MinMax Orchestrator Sonnet 5', 'display_name: MinMax Orchestrator Sonnet'),
              ],
              Path('minmax-orchestrator-sonnet/references/loop-mode.md'): [
                  ('MinMax Orchestrator Sonnet 5 remains the root control plane', 'MinMax Orchestrator Sonnet remains the root control plane'),
              ],
              Path('minmax-orchestrator-sonnet/references/workspace-integration.md'): [
                  ('minmax-orchestrator-sonnet-5', 'minmax-orchestrator-sonnet'),
                  ('MinMax Orchestrator Sonnet 5', 'MinMax Orchestrator Sonnet'),
              ],
              Path('variants/sonnet/README.md'): [
                  ('# Sonnet 5 Variant', '# Sonnet Variant'),
                  ('MinMax Orchestrator Sonnet 5', 'MinMax Orchestrator Sonnet'),
                  ('minmax-orchestrator-sonnet-5/', 'minmax-orchestrator-sonnet/'),
                  ('Sonnet 5 is derived', 'Sonnet is derived'),
                  ('The Sonnet 5 distribution uses', 'The Sonnet distribution uses'),
              ],
              Path('tools/materialize_sonnet.py'): [
                  ('minmax-orchestrator-sonnet-5', 'minmax-orchestrator-sonnet'),
                  ('variants" / "sonnet-5', 'variants" / "sonnet'),
                  ('Claude Sonnet 5-specific workspace-level manager/orchestrator', 'Claude Sonnet-specific workspace-level manager/orchestrator'),
                  ('MinMax Orchestrator Sonnet 5', 'MinMax Orchestrator Sonnet'),
                  ('Sonnet 5 identity was not materialized', 'Sonnet identity was not materialized'),
                  ('materialized Sonnet 5 from stable Luna baseline plus Anthropic deltas', 'materialized Sonnet from stable Luna baseline plus Anthropic deltas'),
              ],
              Path('.github/workflows/promote-sonnet.yml'): [
                  ('Promote Sonnet 5 stable release', 'Promote Sonnet stable release'),
                  ('promote-sonnet-5.yml', 'promote-sonnet.yml'),
                  ('Materialize stable Sonnet 5', 'Materialize stable Sonnet'),
                  ('materialize_sonnet_5.py', 'materialize_sonnet.py'),
                  ('Validate Sonnet 5', 'Validate Sonnet'),
                  ('minmax-orchestrator-sonnet-5', 'minmax-orchestrator-sonnet'),
                  ('Sonnet 5 release already materialized.', 'Sonnet release already materialized.'),
                  ('Add stable Sonnet 5 orchestrator release', 'Add stable Sonnet orchestrator release'),
              ],
              Path('tools/validate_all.py'): [
                  ('minmax-orchestrator-sonnet-5', 'minmax-orchestrator-sonnet'),
              ],
          }
          for path, reps in replacements_by_file.items():
              text = path.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'FAIL: expected rename source missing in {path}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          identity_path = Path('variants/sonnet/identity.json')
          identity = json.loads(identity_path.read_text(encoding='utf-8'))
          identity['skill_name'] = 'minmax-orchestrator-sonnet'
          identity['display_name'] = 'MinMax Orchestrator Sonnet'
          # Keep primary_model pinned to the current Anthropic model ID.
          identity_path.write_text(json.dumps(identity, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Public README: keep it client-facing and expose stable Sonnet as a release family name.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          start = text.index('### MinMax Orchestrator Luna')
          end = text.index('## What the orchestrator will not do')
          replacement = '''### MinMax Orchestrator Luna

Luna is a stable model-specific release.

Use it when running the Luna model and you want the stable, standalone MinMax Orchestrator distribution. Installing or invoking Orchestrator Luna is enough to select that version; it does not require NEXT to be installed alongside it.

As model-specific behavior is validated, Luna can diverge from NEXT where a different orchestration choice produces a better result for Luna.

### MinMax Orchestrator Sonnet

Sonnet is the stable Anthropic release.

Use it with the Claude Sonnet family when you want a standalone Orchestrator calibrated for Anthropic's efficiency-to-capability trade-offs. Sonnet remains the default substantive workhorse while the Orchestrator can route bounded work down to Haiku or escalate narrow, load-bearing nodes to Opus or frontier models when the runtime exposes those controls and the expected benefit justifies the cost.

The release name is intentionally **Sonnet**, not tied to a specific model version. The routing policy can track the current stable Claude Sonnet generation without changing the Skill's public identity every time Anthropic updates the model family.

Like every model-specific release, Orchestrator Sonnet is self-contained at runtime and does not require NEXT, Luna, persistent memory, a profile switch, or repository support files.

```text
                    MinMax Orchestrator NEXT
                    experimental laboratory
                              ↓
                 validated model-specific promotion
                         ↙             ↘
       MinMax Orchestrator Luna     MinMax Orchestrator Sonnet
       stable standalone release    stable standalone release
```

Future model-specific distributions follow the same separation: experimentation happens in NEXT; stable, dependency-free releases are named for the model family they are designed to orchestrate.

'''
          readme.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # Permanent maintenance rule. README stays client-facing; this file carries repo-maintenance policy.
          Path('AGENTS.md').write_text('''# Repository Maintenance Rules\n\n## README synchronization is mandatory\n\nEvery repository update must include an explicit README review before it is considered complete.\n\nWhen a change affects public behavior, model support, release names, stable distributions, usage, compatibility, installation, capabilities, limitations, or project status, update `README.md` in the same change. Do not merge or publish a user-visible repository change with a stale README.\n\nFor maintenance-only changes with no user-visible effect, still verify that the README remains accurate. The README must remain fully client-facing: document only what a user needs to understand, choose, install, or use the project; do not expose private environment details, internal conversation context, temporary migration mechanics, or maintainer-only implementation history.\n''', encoding='utf-8')

          policy = Path('shared/model-variant-policy.md')
          ptext = policy.read_text(encoding='utf-8')
          marker = '## README synchronization\n'
          if marker not in ptext:
              ptext += '''\n## README synchronization\n\nEvery repository change requires a README accuracy review. Any change that affects user-visible behavior, supported models, release identity, compatibility, usage, capabilities, limitations, or status must update the root `README.md` in the same change. The README remains client-facing and must not contain private environment or maintainer-only operational context.\n'''
          policy.write_text(ptext, encoding='utf-8')
          PY
      - name: Verify no stale release identity
        run: |
          if grep -R -n --exclude-dir=.git -E 'minmax-orchestrator-sonnet-5|MinMax Orchestrator Sonnet 5|variants/sonnet-5|materialize_sonnet_5|promote-sonnet-5' .; then
            echo 'FAIL: stale Sonnet 5 release identity remains.' >&2
            exit 1
          fi
      - name: Validate all distributions
        run: python tools/validate_all.py
      - name: Validate Sonnet skill identity
        run: |
          grep -q '^name: minmax-orchestrator-sonnet$' minmax-orchestrator-sonnet/SKILL.md
          grep -q '^# MinMax Orchestrator Sonnet$' minmax-orchestrator-sonnet/SKILL.md
          grep -q 'Claude Sonnet 5' minmax-orchestrator-sonnet/references/model-routing.md
          test -f AGENTS.md
      - name: Clean and commit migration
        run: |
          find minmax-orchestrator-sonnet -type d -name '__pycache__' -prune -exec rm -rf {} +
          find minmax-orchestrator-sonnet -type d -name '.pytest_cache' -prune -exec rm -rf {} +
          rm .github/workflows/rename-sonnet.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rename stable Sonnet orchestrator release'
          git push
