name: Apply external verification policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-external-verify-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Assemble and preflight patch
        run: |
          cat patches/external-verify-policy/part-* > /tmp/external-verify-policy.patch
          git apply --check /tmp/external-verify-policy.patch
      - name: Apply policy to NEXT
        run: git apply /tmp/external-verify-policy.patch
      - name: Materialize Luna
        run: python tools/materialize_luna.py
      - name: Validate NEXT and Luna
        run: python tools/validate_all.py
      - name: Adversarial evidence validator check
        run: |
          cat > /tmp/invalid-self.json <<'EOF'
          {"schema_version":"1.0","claims":[{"id":"external-claim","truth_domain":"external_world","terminal":true,"status":"PASS","matching_evidence_reasonably_available":true,"evidence":[{"type":"same_model_feedback"}],"limitations":[]}]}
          EOF
          if python minmax-orchestrator-next/scripts/validate_evidence_plan.py /tmp/invalid-self.json; then
            echo 'Self-only external-world PASS was incorrectly accepted.' >&2
            exit 1
          fi
      - name: Clean generated caches
        run: |
          find minmax-orchestrator-next minmax-orchestrator-luna -type d -name '__pycache__' -prune -exec rm -rf {} +
          find minmax-orchestrator-next minmax-orchestrator-luna -type d -name '.pytest_cache' -prune -exec rm -rf {} +
      - name: Commit validated implementation
        run: |
          rm -rf patches/external-verify-policy
          rm .github/workflows/apply-external-verify-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A minmax-orchestrator-next minmax-orchestrator-luna patches .github/workflows/apply-external-verify-policy.yml
          git commit -m 'Require claim-matched external verification'
          git push
